AWSTemplateFormatVersion: '2010-09-09'
Description: deploy Street Food project on aws

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Configuration Parameters
        Parameters:
          - ParamUsername
          - ParamUserPassword
          - ProjectName
          - ParamPostgresUrl
          - ParamProdDomain
          - ParamHostedZoneId
          - ParamAcmCertificateArn

Parameters:
  ParamUsername:
    Type: String
    Description: Username
    Default: wsaputra1
  ParamUserPassword:
    Type: String
    Description: Password
    NoEcho: true
  ParamPostgresUrl:
    Type: String
    Description: PostgresUrl, postgresql://...
  ProjectName:
    Type: String
    Default: street-food-02
    Description: Resource/Project name for needed aws services
  ParamProdDomain:
    Type: String
    Default: sf-prod.wiwitadityasaputra.com
    Description: Production domain (Route53)
  ParamHostedZoneId:
    Type: String
    Default: Z0358711QMOX1SF1J2Q6
    Description: Hosted zone id (Route53)
  ParamAcmCertificateArn:
    Type: String
    Default: arn:aws:acm:us-east-1:574434081764:certificate/112a96a3-50c6-4beb-86eb-7fde2303e76a
    Description: ACM certifiate for domain

Resources:
  # parameter store
  PsPostgresUrl:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /${ProjectName}/prod/postgres_url
      Type: String
      Value: !Ref ParamPostgresUrl
  PsDockerIndex:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /${ProjectName}/prod/docker_image/index
      Type: String
      Value: '0'
  PsDockerLatest:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /${ProjectName}/prod/docker_image/latest
      Type: String
      Value: Prod-0-123456

  # code commit
  GitRepository:
    DependsOn:
      - PsPostgresUrl
      - PsDockerIndex
      - PsDockerLatest
    Type: AWS::CodeCommit::Repository
    Properties:
      RepositoryName: !Ref ProjectName

  # ecr
  DockerImageRepository:
    DependsOn:
      - PsPostgresUrl
      - PsDockerIndex
      - PsDockerLatest
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Ref ProjectName
      ImageTagMutability: MUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256

  # user & groups
  UserGroup01:
    Type: AWS::IAM::Group
    Properties:
      GroupName: !Sub ${ProjectName}-admin-01a
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMFullAccess
        - arn:aws:iam::aws:policy/AWSCodeCommitFullAccess
        - arn:aws:iam::aws:policy/AWSStepFunctionsFullAccess
        - arn:aws:iam::aws:policy/AWSXrayFullAccess
  MyIAMUser:
    DependsOn:
      - UserGroup01
      - GitRepository
      - DockerImageRepository
    Type: AWS::IAM::User
    Properties:
      UserName: !Ref ParamUsername
      Groups:
        - !Ref UserGroup01
      Path: /
      LoginProfile:
        Password: !Ref ParamUserPassword

  # code build
  CodeBuildServiceRole:
    DependsOn: MyIAMUser
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ProjectName}-build-docker-image-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Path: /
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AWSCodeCommitReadOnly
        - arn:aws:iam::aws:policy/AmazonSSMFullAccess
        - arn:aws:iam::aws:policy/CloudWatchLogsFullAccess
        - arn:aws:iam::aws:policy/AWSCodeBuildAdminAccess
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryPowerUser
        - arn:aws:iam::aws:policy/AmazonS3FullAccess
  CodeBuildProject:
    DependsOn: CodeBuildServiceRole
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub ${ProjectName}-build-docker-image
      ServiceRole: !GetAtt CodeBuildServiceRole.Arn
      Artifacts:
        Type: NO_ARTIFACTS
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/standard:8.0-26.07.29
        EnvironmentVariables:
          - Name: DOCKER_IMAGE_TAG
            Type: PARAMETER_STORE
            Value: !Sub /${ProjectName}/prod/docker_image/latest
          - Name: POSTGRES_URL
            Type: PARAMETER_STORE
            Value: !Sub /${ProjectName}/prod/postgres_url
      SourceVersion: refs/heads/prod
      TimeoutInMinutes: 15
      Source:
        Type: CODECOMMIT
        Location: !Sub https://git-codecommit.${AWS::Region}.amazonaws.com/v1/repos/${ProjectName}
        BuildSpec: !Sub |
          version: 0.2
          env:
            parameter-store:
              POSTGRES_URL: "/${ProjectName}/prod/postgres_url"
          phases:
            pre_build:
              commands:
                - echo SF-d Logging in to Amazon ECR...
                - aws ecr get-login-password --region ${AWS::Region} | docker login --username AWS --password-stdin ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com
            build:
              commands:
                - echo SF-d Building the Docker image, `date`
                - docker build --build-arg POSTGRES_URL=$POSTGRES_URL -t ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${ProjectName}:$DOCKER_IMAGE_TAG .
            post_build:
              commands:
                - echo SF-d Pushing the Docker image, `date`
                - docker push ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${ProjectName}:$DOCKER_IMAGE_TAG
      LogsConfig:
        CloudWatchLogs:
          Status: ENABLED
  CodeBuildProject02:
    DependsOn: CodeBuildServiceRole
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub ${ProjectName}-build-docker-image-02
      ServiceRole: !GetAtt CodeBuildServiceRole.Arn
      Artifacts:
        Type: NO_ARTIFACTS
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/standard:8.0-26.07.29
      SourceVersion: refs/heads/prod
      TimeoutInMinutes: 15
      Source:
        Type: CODECOMMIT
        Location: !Sub https://git-codecommit.${AWS::Region}.amazonaws.com/v1/repos/${ProjectName}
        BuildSpec: !Sub |
          version: 0.2
          env:
            parameter-store:
              POSTGRES_URL: "/${ProjectName}/prod/postgres_url"
              DOCKER_IMAGE_INDEX: "/${ProjectName}/prod/docker_image/index"
          phases:
            pre_build:
              commands:
                - echo SF-d Logging in to Amazon ECR, `date`
                - echo commit-id $CODEBUILD_RESOLVED_SOURCE_VERSION
                - SHORT_COMMIT=$(echo -n "$CODEBUILD_RESOLVED_SOURCE_VERSION" | tail -c 6)
                - echo short-commit $SHORT_COMMIT
                - echo postgres-url $POSTGRES_URL
                - echo docker-image-index $DOCKER_IMAGE_INDEX
                - NEW_DOCKER_IMAGE_INDEX=$(($DOCKER_IMAGE_INDEX + 1))
                - echo new-docker-image-index $NEW_DOCKER_IMAGE_INDEX
                - NEW_DOCKER_IMAGE_LATEST="prod-$NEW_DOCKER_IMAGE_INDEX-$SHORT_COMMIT"
                - echo new-docker-image-latest $NEW_DOCKER_IMAGE_LATEST
                - aws ecr get-login-password --region ${AWS::Region} | docker login --username AWS --password-stdin ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com
            build:
              commands:
                - echo SF-d Building the Docker image, `date`
                - echo new-docker-image-latest $NEW_DOCKER_IMAGE_LATEST
                - echo new-docker-image-index $NEW_DOCKER_IMAGE_INDEX
                - docker build --build-arg POSTGRES_URL=$POSTGRES_URL -t ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${ProjectName}:$NEW_DOCKER_IMAGE_LATEST .
            post_build:
              commands:
                - echo SF-d Pushing the Docker image, `date`
                - echo new-docker-image-latest $NEW_DOCKER_IMAGE_LATEST
                - echo new-docker-image-index $NEW_DOCKER_IMAGE_INDEX
                - docker push ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${ProjectName}:$NEW_DOCKER_IMAGE_LATEST
                - aws ssm put-parameter --name "/${ProjectName}/prod/docker_image/index" --value "$NEW_DOCKER_IMAGE_INDEX" --type "String" --overwrite
                - aws ssm put-parameter --name "/${ProjectName}/prod/docker_image/latest" --value "$NEW_DOCKER_IMAGE_LATEST" --type "String" --overwrite

      LogsConfig:
        CloudWatchLogs:
          Status: ENABLED

  # step functions - build docker image
  BuildDockerImageStateMachineExecutionRole:
    DependsOn: CodeBuildProject
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ProjectName}-build-docker-image-steps-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: states.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMFullAccess
        - arn:aws:iam::aws:policy/AmazonEventBridgeFullAccess
        - arn:aws:iam::aws:policy/AWSCodeBuildDeveloperAccess
  BuildDockerImageStateMachine:
    DependsOn: BuildDockerImageStateMachineExecutionRole
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: !Sub ${ProjectName}-build-docker-image
      RoleArn: !GetAtt BuildDockerImageStateMachineExecutionRole.Arn
      Definition:
        QueryLanguage: JSONata
        StartAt: 01-Init
        States:

          01-Init:
            Type: Task
            Resource: arn:aws:states:::aws-sdk:ssm:getParameter
            Comment: Extract CodeCommit change details from EventBridge payload
            Arguments:
              Name: !Sub /${ProjectName}/prod/docker_image/index
              WithDecryption: true
            Output:
              lastCommitId: '{% $substring($states.input.detail.commitId,
                $length($states.input.detail.commitId) - 6,
                $length($states.input.detail.commitId) - 1) %}'
              lastCommitDate: '{% $states.input.time %}'
              buildIndex: '{% $string($number($states.result.Parameter.Value) + 1) %}'
            Next: 02-ProcessInit

          02-ProcessInit:
            Type: Pass
            Output:
              buildIndex: '{% $states.input.buildIndex %}'
              dockerImageTag: '{% ''PROD-'' & $states.input.buildIndex & ''-'' &
                $states.input.lastCommitId %}'
            Next: 03-BuildProdImage

          03-BuildProdImage:
            Type: Task
            Resource: arn:aws:states:::codebuild:startBuild.sync
            Arguments:
              ProjectName: !Sub ${ProjectName}-build-docker-image
              EnvironmentVariablesOverride:
                - Name: DOCKER_IMAGE_TAG
                  Type: PLAINTEXT
                  Value: '{% $states.input.dockerImageTag %}'

            Output:
              buildIndex: '{% $states.input.buildIndex %}'
              dockerImageTag: '{% $states.input.dockerImageTag %}'
            Next: 04-UpdateParamterStoreDockerIndex

          04-UpdateParamterStoreDockerIndex:
            Type: Task
            Resource: arn:aws:states:::aws-sdk:ssm:putParameter
            Arguments:
              Name: !Sub /${ProjectName}/prod/docker_image/index
              Value: '{% $states.input.buildIndex %}'
              Type: String
              Overwrite: true
            Output:
              dockerImageTag: '{% $states.input.dockerImageTag %}'
            Next: 05-UpdateParamterStoreDockerLatest

          05-UpdateParamterStoreDockerLatest:
            Type: Task
            Resource: arn:aws:states:::aws-sdk:ssm:putParameter
            Arguments:
              Name: !Sub /${ProjectName}/prod/docker_image/latest
              Value: '{% $states.input.dockerImageTag %}'
              Type: String
              Overwrite: true
            Output:
              dockerImageTag: '{% $states.input.dockerImageTag %}'
            Next: 06-Succeed

          06-Succeed:
            Type: Succeed
            Comment: docker images should have new :latest version
            Output:
              dockerImageTag: '{% $states.input.dockerImageTag %}'

  # event bridge
  GitRepoChangedExecutionRole:
    DependsOn: BuildDockerImageStateMachine
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ProjectName}-build-docker-image-trigger-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sts:AssumeRole
      MaxSessionDuration: 3600
  GitRepoChangedPolicy:
    DependsOn: GitRepoChangedExecutionRole
    Type: AWS::IAM::RolePolicy
    Properties:
      PolicyName: !Sub ${ProjectName}-build-docker-image-trigger-policy
      RoleName: !Ref GitRepoChangedExecutionRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - states:StartExecution
            Resource:
              - !Sub arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:stateMachine:${ProjectName}*
  GitRepoChangedRule:
    Type: AWS::Events::Rule
    DependsOn:
      - GitRepoChangedExecutionRole
      - GitRepoChangedPolicy
    Properties:
      Name: !Sub ${ProjectName}-build-docker-image-trigger-event
      EventPattern: !Sub |-
        {
            "source":["aws.codecommit"],
            "detail-type":["CodeCommit Repository State Change"],
            "resources":["arn:${AWS::Partition}:codecommit:${AWS::Region}:${AWS::AccountId}:${ProjectName}"],
            "detail":{
                "event":["referenceCreated","referenceUpdated"],
                "referenceType":["branch"],
                "referenceName":["prod"]
            }
        }
      State: DISABLED
      EventBusName: default
      Targets:
        - Id: !Sub ${ProjectName}-build-docker-image-steps-target-id
          Arn: !Sub arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:stateMachine:${ProjectName}-build-docker-image
          RoleArn: !GetAtt GitRepoChangedExecutionRole.Arn

  # ecs
  TaskDefinitionExecutionRole:
    DependsOn: GitRepoChangedRule
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ProjectName}-task-definition-role
      AssumeRolePolicyDocument:
        Version: '2008-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
  TaskDefinition:
    DependsOn: TaskDefinitionExecutionRole
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub ${ProjectName}-task-definition
      NetworkMode: awsvpc
      Cpu: '512'
      Memory: '1024'
      RequiresCompatibilities:
        - FARGATE
      TaskRoleArn: !GetAtt TaskDefinitionExecutionRole.Arn
      ExecutionRoleArn: !GetAtt TaskDefinitionExecutionRole.Arn
      ContainerDefinitions:
        - Name: !Sub ${ProjectName}-main-container
          Image: !Sub ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${ProjectName}:PROD-0-000000
          Cpu: 0
          Essential: true
          PortMappings:
            - ContainerPort: 3000
              HostPort: 3000
              Protocol: tcp
              Name: !Sub ${ProjectName}-mapping-3000-tcp
  StreetFoodCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub ${ProjectName}-cluster
      CapacityProviders:
        - FARGATE
        - FARGATE_SPOT

  # step functions - init
  InitServicesRole:
    DependsOn: StreetFoodCluster
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ProjectName}-deployment-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - states.amazonaws.com
                - ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonECS_FullAccess
        - arn:aws:iam::aws:policy/AmazonRoute53FullAccess
        - arn:aws:iam::aws:policy/AmazonSSMFullAccess
        - arn:aws:iam::aws:policy/AmazonEC2ReadOnlyAccess
        - arn:aws:iam::aws:policy/AmazonEC2FullAccess
      Policies:
        - PolicyName: !Sub ${ProjectName}-deploy-inline-policy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - iam:PassRole
                "Resource": !Sub arn:aws:iam::${AWS::AccountId}:role/${ProjectName}-codedeploy-deploymentgroup-role
  InitServicesExecution:
    DependsOn: InitServicesRole
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: !Sub ${ProjectName}-init-services-ONE-TIME-ONLY
      StateMachineType: STANDARD
      RoleArn: !GetAtt InitServicesRole.Arn
      TracingConfiguration:
        Enabled: false
      DefinitionString: !Sub |
        {
          "StartAt": "vpc",
          "States": {
            "vpc": {
              "Type": "Task",
              "Resource": "arn:aws:states:::aws-sdk:ec2:describeVpcs",
              "Arguments": {
                "Filters": [
                  {
                    "Name": "is-default",
                    "Values": [
                      "true"
                    ]
                  }
                ]
              },
              "Assign": {
                "VpcId": "{% $states.result.Vpcs[0].VpcId %}"
              },
              "Next": "subnets"
            },
            "subnets": {
              "Type": "Task",
              "Resource": "arn:aws:states:::aws-sdk:ec2:describeSubnets",
              "Arguments": {
                "Filters": [
                  {
                    "Name": "vpc-id",
                    "Values": [
                      "{% $VpcId %}"
                    ]
                  }
                ]
              },
              "Assign": {
                "SubnetIds": "{% $states.result.Subnets.SubnetId %}",
                "LoadBalancerSecurityGroupName": "${ProjectName}-lb-security-group"
              },
              "Next": "loadbalancer - security groups - describe"
            },
            "loadbalancer - security groups - describe": {
              "Type": "Task",
              "Resource": "arn:aws:states:::aws-sdk:ec2:describeSecurityGroups",
              "Arguments": {
                "Filters": [
                  {
                    "Name": "group-name",
                    "Values": [
                      "{% $LoadBalancerSecurityGroupName %}"
                    ]
                  },
                  {
                    "Name": "vpc-id",
                    "Values": [
                      "{% $VpcId %}"
                    ]
                  }
                ]
              },
              "Assign": {
                "LoadBalancerSecurityGroupId": "{% $states.result.SecurityGroups[0] ? $states.result.SecurityGroups[0].GroupId : null %}"
              },
              "Next": "loadbalancer - security groups - check"
            },
            "loadbalancer - security groups - check": {
              "Type": "Choice",
              "Choices": [
                {
                  "Condition": "{% $LoadBalancerSecurityGroupId = null %}",
                  "Next": "loadbalancer - security groups - create"
                }
              ],
              "Default": "paramter store - get"
            },
            "loadbalancer - security groups - create": {
              "Type": "Task",
              "Resource": "arn:aws:states:::aws-sdk:ec2:createSecurityGroup",
              "Arguments": {
                "GroupName": "{% $LoadBalancerSecurityGroupName %}",
                "Description": "security group for lb",
                "VpcId": "{% $VpcId %}"
              },
              "Assign": {
                "LoadBalancerSecurityGroupId": "{% $states.result.GroupId %}"
              },
              "Next": "loadbalancer - authorize inbound traffict"
            },
            "loadbalancer - authorize inbound traffict": {
              "Type": "Task",
              "Resource": "arn:aws:states:::aws-sdk:ec2:authorizeSecurityGroupIngress",
              "Arguments": {
                "GroupId": "{% $LoadBalancerSecurityGroupId %}",
                "IpPermissions": [
                  {
                    "IpProtocol": "tcp",
                    "FromPort": 80,
                    "ToPort": 80,
                    "IpRanges": [
                      {
                        "CidrIp": "0.0.0.0/0",
                        "Description": "Allow HTTP from anywhere"
                      }
                    ]
                  },
                  {
                    "IpProtocol": "tcp",
                    "FromPort": 443,
                    "ToPort": 443,
                    "IpRanges": [
                      {
                        "CidrIp": "0.0.0.0/0",
                        "Description": "Allow HTTPS from anywhere"
                      }
                    ]
                  }
                ]
              },
              "Next": "paramter store - get"
            },
            "paramter store - get": {
              "Type": "Task",
              "Resource": "arn:aws:states:::aws-sdk:ssm:getParameter",
              "Arguments": {
                "Name": "/${ProjectName}/prod/docker_image/latest",
                "WithDecryption": true
              },
              "Assign": {
                "DockerImageTag": "{% $states.result.Parameter.Value %}",
                "Random4Number": "{% $string($floor($random() * 90000) + 10000) %}"
              },
              "Next": "task definition - register"
            },
            "task definition - register": {
              "Type": "Task",
              "QueryLanguage": "JSONata",
              "Resource": "arn:aws:states:::aws-sdk:ecs:registerTaskDefinition",
              "Arguments": {
                "Family": "${ProjectName}-task-definition",
                "NetworkMode": "awsvpc",
                "RequiresCompatibilities": [
                  "FARGATE"
                ],
                "Cpu": "512",
                "Memory": "1024",
                "TaskRoleArn": "arn:aws:iam::${AWS::AccountId}:role/${ProjectName}-task-definition-role",
                "ExecutionRoleArn": "arn:aws:iam::${AWS::AccountId}:role/${ProjectName}-task-definition-role",
                "ContainerDefinitions": [
                  {
                    "Name": "${ProjectName}-main-container",
                    "Image": "{% '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${ProjectName}:' & $DockerImageTag %}",
                    "Cpu": 0,
                    "PortMappings": [
                      {
                        "ContainerPort": 3000,
                        "HostPort": 3000,
                        "Protocol": "tcp",
                        "Name": "${ProjectName}-mapping-3000-tcp"
                      }
                    ],
                    "Essential": true
                  }
                ]
              },
              "Assign": {
                "ServiceName": "{% '${ProjectName}-service-' & $DockerImageTag & '-' & $Random4Number %}",
                "ResourceId": "{% 'service/${ProjectName}-cluster/${ProjectName}-service-' & $DockerImageTag & '-' & $Random4Number %}",
                "TaskDefinitionArn": "{% $states.result.TaskDefinition.TaskDefinitionArn %}",
                "LoadBalancerName": "{% '${ProjectName}-loadbalancer' %}"
              },
              "Next": "loadbalancer - describe"
            },
            "loadbalancer - describe": {
              "Type": "Task",
              "Resource": "arn:aws:states:::aws-sdk:elasticloadbalancingv2:describeLoadBalancers",
              "Arguments": {
                "Names": [
                  "${ProjectName}-loadbalancer"
                ]
              },
              "Catch": [
                {
                  "ErrorEquals": [
                    "ElasticLoadBalancingV2.LoadBalancerNotFoundException"
                  ],
                  "Next": "loadbalancer - create"
                }
              ],
              "Next": "target groups - blue - describe"
            },
            "loadbalancer - create": {
              "Type": "Task",
              "Arguments": {
                "Name": "{% '${ProjectName}-loadbalancer' %}",
                "Subnets": "{% $SubnetIds %}",
                "SecurityGroups": "{% [$LoadBalancerSecurityGroupId] %}",
                "Scheme": "internet-facing",
                "Type": "application"
              },
              "Resource": "arn:aws:states:::aws-sdk:elasticloadbalancingv2:createLoadBalancer",
              "Assign": {
                "LoadBalancerArn": "{% $states.result.LoadBalancers[0].LoadBalancerArn %}",
                "LoadBalancerDnsName": "{% $states.result.LoadBalancers[0].DnsName %}",
                "LoadBalancerHostedZoneId": "{% $states.result.LoadBalancers[0].CanonicalHostedZoneId %}"
              },
              "Next": "target groups - blue - describe"
            },
            "target groups - blue - describe": {
              "Type": "Task",
              "Resource": "arn:aws:states:::aws-sdk:elasticloadbalancingv2:describeTargetGroups",
              "Arguments": {
                "Names": [
                  "${ProjectName}-targetgroup-blue"
                ]
              },
              "Catch": [{
                "ErrorEquals": ["ElasticLoadBalancingV2.TargetGroupNotFoundException"],
                "Next": "target groups - blue - create"
              }],
              "Assign": {
                "TargetGroupBlueArn": "{% $states.result.TargetGroups[0].TargetGroupArn %}"
              },
              "Next": "target groups - green - describe"
            },
            "target groups - blue - create": {
              "Type": "Task",
              "Arguments": {
                "Name": "${ProjectName}-targetgroup-blue",
                "Protocol": "HTTP",
                "Port": 3000,
                "VpcId": "{% $VpcId %}",
                "TargetType": "ip"
              },
              "Resource": "arn:aws:states:::aws-sdk:elasticloadbalancingv2:createTargetGroup",
              "Assign": {
                "TargetGroupBlueArn": "{% $states.result.TargetGroups[0].TargetGroupArn %}"
              },
              "Next": "target groups - green - describe"
            },

            "target groups - green - describe": {
              "Type": "Task",
              "Resource": "arn:aws:states:::aws-sdk:elasticloadbalancingv2:describeTargetGroups",
              "Arguments": {
                "Names": [
                  "${ProjectName}-targetgroup-green"
                ]
              },
              "Catch": [
                {
                  "ErrorEquals": [ "ElasticLoadBalancingV2.TargetGroupNotFoundException" ],
                  "Next": "target groups - green - create"
                }
              ],
              "Assign": {
                "TargetGroupGreenArn": "{% $states.result.TargetGroups[0].TargetGroupArn %}"
              },
              "Next": "loadbalancer - http listener - create"
            },
            "target groups - green - create": {
              "Type": "Task",
              "Arguments": {
                "Name": "${ProjectName}-targetgroup-green",
                "Protocol": "HTTP",
                "Port": 3000,
                "VpcId": "{% $VpcId %}",
                "TargetType": "ip"
              },
              "Resource": "arn:aws:states:::aws-sdk:elasticloadbalancingv2:createTargetGroup",
              "Assign": {
                "TargetGroupGreenArn": "{% $states.result.TargetGroups[0].TargetGroupArn %}"
              },
              "Next": "loadbalancer - http listener - create"
            },

            "loadbalancer - http listener - create": {
              "Type": "Task",
              "Arguments": {
                "LoadBalancerArn": "{% $LoadBalancerArn %}",
                "Protocol": "HTTP",
                "Port": 80,
                "DefaultActions": [
                  {
                    "Type": "redirect",
                    "RedirectConfig": {
                      "Protocol": "HTTPS",
                      "Port": "443",
                      "StatusCode": "HTTP_301"
                    }
                  }
                ]
              },
              "Resource": "arn:aws:states:::aws-sdk:elasticloadbalancingv2:createListener",
              "Next": "loadbalancer - https listener - create"
            },
            "loadbalancer - https listener - create": {
              "Type": "Task",
              "Arguments": {
                "LoadBalancerArn": "{% $LoadBalancerArn %}",
                "Protocol": "HTTPS",
                "Port": 443,
                "SslPolicy": "ELBSecurityPolicy-TLS13-1-2-2021-06",
                "Certificates": [
                  {
                    "CertificateArn": "${ParamAcmCertificateArn}"
                  }
                ],
                "DefaultActions": [
                  {
                    "Type": "forward",
                    "TargetGroupArn": "{% $TargetGroupBlueArn %}"
                  }
                ]
              },
              "Resource": "arn:aws:states:::aws-sdk:elasticloadbalancingv2:createListener",
              "Assign": {
                "LoadBalancerHttpsListenerArn": "{% $states.result.Listeners[0].ListenerArn %}",
                "TaskDefinitionSecurityGroupName": "${ProjectName}-td-security-group"
              },
              "Next": "task definitions - security groups - describe"
            },

            "task definitions - security groups - describe": {
              "Type": "Task",
              "Resource": "arn:aws:states:::aws-sdk:ec2:describeSecurityGroups",
              "Arguments": {
                "Filters": [
                  {
                    "Name": "group-name",
                    "Values": [ "{% $TaskDefinitionSecurityGroupName %}" ]
                  },
                  {
                    "Name": "vpc-id",
                    "Values": [ "{% $VpcId %}" ]
                  }
                ]
              },
              "Assign": {
                "TaskDefinitionSecurityGroupId": "{% $states.result.SecurityGroups[0] ? $states.result.SecurityGroups[0].GroupId : null %}"
              },
              "Next": "task definitions - security groups - check"
            },
            "task definitions - security groups - check": {
              "Type": "Choice",
              "Choices": [
                {
                  "Condition": "{% $TaskDefinitionSecurityGroupId = null %}",
                  "Next": "task definitions - security groups - create"
                }
              ],
              "Default": "service - create"
            },
            "task definitions - security groups - create": {
              "Type": "Task",
              "Resource": "arn:aws:states:::aws-sdk:ec2:createSecurityGroup",
              "Arguments": {
                "GroupName": "{% $TaskDefinitionSecurityGroupName %}",
                "Description": "security group for lb",
                "VpcId": "{% $VpcId %}"
              },
              "Assign": {
                "TaskDefinitionSecurityGroupId": "{% $states.result.GroupId %}"
              },
              "Next": "task definitions - security groups - inbound traffict"
            },
            "task definitions - security groups - inbound traffict": {
              "Type": "Task",
              "Resource": "arn:aws:states:::aws-sdk:ec2:authorizeSecurityGroupIngress",
              "Arguments": {
                "GroupId": "{% $TaskDefinitionSecurityGroupId %}",
                "IpPermissions": [
                  {
                    "IpProtocol": "tcp",
                    "FromPort": 3000,
                    "ToPort": 3000,
                    "IpRanges": [
                      {
                        "CidrIp": "0.0.0.0/0",
                        "Description": "Allow HTTP from anywhere"
                      }
                    ]
                  }
                ]
              },
              "Next": "service - create"
            },

            "service - create": {
              "Type": "Task",
              "Arguments": {
                "TaskDefinition": "{% $TaskDefinitionArn %}",
                "ServiceName": "{% $ServiceName %}",
                "Cluster": "arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:cluster/${ProjectName}-cluster",
                "DesiredCount": 1,
                "LaunchType": "FARGATE",
                "AvailabilityZoneRebalancing": "ENABLED",
                "DeploymentController": {
                  "Type": "CODE_DEPLOY"
                },
                "LoadBalancers": [
                  {
                    "TargetGroupArn": "{% $TargetGroupBlueArn %}",
                    "ContainerName": "${ProjectName}-main-container",
                    "ContainerPort": 3000
                  }
                ],
                "NetworkConfiguration": {
                  "AwsvpcConfiguration": {
                    "Subnets": "{% $SubnetIds %}",
                    "SecurityGroups": "{% [$TaskDefinitionSecurityGroupId] %}",
                    "AssignPublicIp": "ENABLED"
                  }
                }
              },
              "Resource": "arn:aws:states:::aws-sdk:ecs:createService",
              "Next": "task definition - register auto scale"
            },
            "task definition - register auto scale": {
              "Type": "Task",
              "Arguments": {
                "ServiceNamespace": "ecs",
                "ResourceId": "{% $ResourceId %}",
                "ScalableDimension": "ecs:service:DesiredCount",
                "MinCapacity": 1,
                "MaxCapacity": 2
              },
              "Resource": "arn:aws:states:::aws-sdk:applicationautoscaling:registerScalableTarget",
              "Next": "task definition - put scaling policy"
            },
            "task definition - put scaling policy": {
              "Type": "Task",
              "Arguments": {
                "PolicyName": "${ProjectName}-app-cpu-scaling-policy",
                "ServiceNamespace": "ecs",
                "ResourceId": "{% $ResourceId %}",
                "ScalableDimension": "ecs:service:DesiredCount",
                "PolicyType": "TargetTrackingScaling",
                "TargetTrackingScalingPolicyConfiguration": {
                  "TargetValue": 70,
                  "PredefinedMetricSpecification": {
                    "PredefinedMetricType": "ECSServiceAverageCPUUtilization"
                  },
                  "DisableScaleIn": true
                }
              },
              "Resource": "arn:aws:states:::aws-sdk:applicationautoscaling:putScalingPolicy",
              "Next": "route53 - upsert record"
            },

            "route53 - upsert record": {
              "Type": "Task",
              "Arguments": {
                "HostedZoneId": "${ParamHostedZoneId}",
                "ChangeBatch": {
                  "Changes": [
                    {
                      "Action": "UPSERT",
                      "ResourceRecordSet": {
                        "Name": "${ParamProdDomain}",
                        "Type": "A",
                        "AliasTarget": {
                          "HostedZoneId": "{% $LoadBalancerHostedZoneId %}",
                          "DnsName": "{% $LoadBalancerDnsName %}",
                          "EvaluateTargetHealth": true
                        }
                      }
                    }
                  ]
                }
              },
              "Resource": "arn:aws:states:::aws-sdk:route53:changeResourceRecordSets",
              "Next": "Succeed"
            },

            "Succeed": {
              "Type": "Succeed",
              "Output": {
                "VpcId": "{% $VpcId %}",
                "SubnetIds": "{% $SubnetIds %}",
                "DockerImageTag": "{% $DockerImageTag %}",
                "Random4Number": "{% $Random4Number %}",
                "ServiceName": "{% $ServiceName %}",
                "ResourceId": "{% $ResourceId %}",
                "TaskDefinitionArn": "{% $ResourceId %}",
                "LoadBalancerName": "{% $LoadBalancerName %}",
                "LoadBalancerArn": "{% $LoadBalancerArn %}",
                "LoadBalancerDnsName": "{% $LoadBalancerDnsName %}",
                "LoadBalancerHostedZoneId": "{% $LoadBalancerHostedZoneId %}"
              }
            }
          },
          "QueryLanguage": "JSONata"
        }
  # step functions - deployment
  DeploymentExecution:
    DependsOn: InitServicesRole
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: !Sub ${ProjectName}-start-deployment
      StateMachineType: STANDARD
      RoleArn: !GetAtt InitServicesRole.Arn
      TracingConfiguration:
        Enabled: false
      DefinitionString: !Sub |
        {
          "StartAt": "paramter store - get",
          "States": {
            "paramter store - get": {
              "Type": "Task",
              "Resource": "arn:aws:states:::aws-sdk:ssm:getParameter",
              "Arguments": {
                "Name": "/${ProjectName}/prod/docker_image/latest",
                "WithDecryption": true
              },
              "Assign": {
                "DockerImageTag": "{% $states.result.Parameter.Value %}"
              }, 
              "Next": "service - list"
            },
            "service - list": {
              "Type": "Task",
              "Resource": "arn:aws:states:::aws-sdk:ecs:listServices",
              "Arguments": {
                "Cluster": "${ProjectName}-cluster",
                "MaxResults": 1
              },
              "Assign": {
                "ServiceName": "{% $substringAfter($states.result.ServiceArns[0], '/') %}"
              },
              "Next": "loadbalancer - describe"
            },
            "loadbalancer - describe": {
              "Type": "Task",
              "Resource": "arn:aws:states:::aws-sdk:elasticloadbalancingv2:describeLoadBalancers",
              "Arguments": {
                "Names": [
                  "${ProjectName}-loadbalancer"
                ]
              },
              "Catch": [
                {
                  "ErrorEquals": [
                    "ElasticLoadBalancingV2.LoadBalancerNotFoundException"
                  ],
                  "Next": "Succeed"
                }
              ],
              "Assign": {
                "LoadBalancerArn": "{% $states.result.LoadBalancers[0].LoadBalancerArn %}"
              },
              "Next": "loadbalancer - listener - describe"
            },
            "loadbalancer - listener - describe": {
              "Type": "Task",
              "Resource": "arn:aws:states:::aws-sdk:elasticloadbalancingv2:describeListeners",
              "Arguments": {
                "LoadBalancerArn": "{% $LoadBalancerArn %}"
              },
              "Assign": {
                "ListenerArn": "{% $states.result.Listeners[Protocol = 'HTTPS' ].ListenerArn %}"
              },
              "Next": "task definition - register"
            },
            "task definition - register": {
              "Type": "Task",
              "Resource": "arn:aws:states:::aws-sdk:ecs:registerTaskDefinition",
              "Arguments": {
                "Family": "${ProjectName}-task-definition",
                "NetworkMode": "awsvpc",
                "RequiresCompatibilities": [
                  "FARGATE"
                ],
                "Cpu": "512",
                "Memory": "1024",
                "TaskRoleArn": "arn:aws:iam::${AWS::AccountId}:role/${ProjectName}-task-definition-role",
                "ExecutionRoleArn": "arn:aws:iam::${AWS::AccountId}:role/${ProjectName}-task-definition-role",
                "ContainerDefinitions": [
                  {
                    "Name": "${ProjectName}-main-container",
                    "Image": "{% '${AWS::AccountId}.dkr.ecr.us-east-1.amazonaws.com/${ProjectName}:' & $DockerImageTag %}",
                    "Cpu": 0,
                    "PortMappings": [
                      {
                        "ContainerPort": 3000,
                        "HostPort": 3000,
                        "Protocol": "tcp",
                        "Name": "${ProjectName}-mapping-3000-tcp"
                      }
                    ],
                    "Essential": true
                  }
                ]
              },
              "Assign": {
                "TaskDefinitionArn": "{% $states.result.TaskDefinition.TaskDefinitionArn %}"
              },
              "Next": "codedeploy - deployment group - get"
            },
            "codedeploy - deployment group - get": {
              "Type": "Task",
              "Resource": "arn:aws:states:::aws-sdk:codedeploy:getDeploymentGroup",
              "Arguments": {
                "ApplicationName": "${ProjectName}-codedeploy",
                "DeploymentGroupName": "${ProjectName}-deploymentgroup-bluegreen"
              },
              "Catch": [
                {
                  "ErrorEquals": [
                    "CodeDeploy.DeploymentGroupDoesNotExistException"
                  ],
                  "Next": "codedeploy - deployment group - create"
                }
              ],
              "Assign": {
                "DeploymentGroupId": "{% $states.result.DeploymentGroupInfo.DeploymentGroupId %}"
              },
              "Next": "codedeploy - createdeployment"
            },
            "codedeploy - deployment group - create": {
              "Type": "Task",
              "Resource": "arn:aws:states:::aws-sdk:codedeploy:createDeploymentGroup",
              "Arguments": {
                "ApplicationName": "${ProjectName}-codedeploy",
                "DeploymentGroupName": "${ProjectName}-deploymentgroup-bluegreen",
                "ServiceRoleArn": "arn:aws:iam::${AWS::AccountId}:role/${ProjectName}-codedeploy-deploymentgroup-role",
                "DeploymentConfigName": "CodeDeployDefault.ECSAllAtOnce",
                "DeploymentStyle": {
                  "DeploymentType": "BLUE_GREEN",
                  "DeploymentOption": "WITH_TRAFFIC_CONTROL"
                },
                "EcsServices": [
                  {
                    "ClusterName": "${ProjectName}-cluster",
                    "ServiceName": "{% $ServiceName %}"
                  }
                ],
                "LoadBalancerInfo": {
                  "TargetGroupPairInfoList": [
                    {
                      "ProdTrafficRoute": {
                        "ListenerArns": [
                          "{% $ListenerArn %}"
                        ]
                      },
                      "TargetGroups": [
                        {
                          "Name": "${ProjectName}-targetgroup-blue"
                        },
                        {
                          "Name": "${ProjectName}-targetgroup-green"
                        }
                      ]
                    }
                  ]
                },
                "BlueGreenDeploymentConfiguration": {
                  "DeploymentReadyOption": {
                    "ActionOnTimeout": "CONTINUE_DEPLOYMENT",
                    "WaitTimeInMinutes": 0
                  },
                  "TerminateBlueInstancesOnDeploymentSuccess": {
                    "Action": "TERMINATE",
                    "TerminationWaitTimeInMinutes": 0
                  }
                }
              },
              "Assign": {
                "DeploymentGroupId": "{% $states.result.DeploymentGroupId %}"
              },
              "Next": "codedeploy - createdeployment"
            },
            "codedeploy - createdeployment": {
              "Type": "Task",
              "Resource": "arn:aws:states:::aws-sdk:codedeploy:createDeployment",
              "Arguments": {
                "ApplicationName": "${ProjectName}-codedeploy",
                "DeploymentGroupName": "${ProjectName}-deploymentgroup-bluegreen",
                "Revision": {
                  "RevisionType": "AppSpecContent",
                  "AppSpecContent": {
                    "Content": "{% 'version: 0.0\nResources:\n  - TargetService:\n      Type: \"AWS::ECS::Service\"\n      Properties:\n        TaskDefinition: \"' & $TaskDefinitionArn & '\"\n        LoadBalancerInfo:\n          ContainerName: \"${ProjectName}-main-container\"\n          ContainerPort: 3000'%}"
                  }
                }
              },
              "Next": "Succeed"
            },
            "Succeed": {
              "Type": "Succeed"
            }
          },
          "QueryLanguage": "JSONata"
        }

  # code deploy
  CodeDeployApplication:
    Type: AWS::CodeDeploy::Application
    Properties:
      ApplicationName: !Sub ${ProjectName}-codedeploy
      ComputePlatform: ECS
  CodeDeployServiceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ProjectName}-codedeploy-deploymentgroup-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codedeploy.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonECS_FullAccess
        - arn:aws:iam::aws:policy/AWSCodeDeployFullAccess
        - arn:aws:iam::aws:policy/AWSCodeDeployRoleForECS
        - arn:aws:iam::aws:policy/CloudWatchEventsFullAccess

  # code pipeline
  CodePipelineServiceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ProjectName}-codepipeline-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codepipeline.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonS3FullAccess
        - arn:aws:iam::aws:policy/AWSCodeBuildAdminAccess
        - arn:aws:iam::aws:policy/AWSCodeCommitFullAccess
        - arn:aws:iam::aws:policy/AWSStepFunctionsFullAccess
  CodePipelineArtifactBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ${ProjectName}-codepipeline
      VersioningConfiguration:
        Status: Enabled
  CodePipelineApplication:
    DependsOn:
      - CodePipelineArtifactBucket
    Type: AWS::CodePipeline::Pipeline
    Properties:
      Name: !Sub ${ProjectName}-build-deployment
      PipelineType: V2
      RoleArn: !GetAtt CodePipelineServiceRole.Arn
      ArtifactStore:
        Type: S3
        Location: !Ref CodePipelineArtifactBucket

      RetryConfiguration:
        RetryMode: FAILED_ACTIONS

      # 1. Block automated event triggers 
      Triggers: [] 

      Stages:
        # Stage 1: Source
        - Name: Source
          Actions:
            - Name: SourceAction
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: CodeCommit
                Version: '1'
              Configuration:
                RepositoryName: !Sub ${ProjectName}
                BranchName: prod
              OutputArtifacts:
                - Name: SourceArtifact
        
        # Stage 2: Build
        - Name: Build
          Actions:
            - Name: BuildAction
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: '1'
              Configuration:
                ProjectName: !Sub ${ProjectName}-build-docker-image-02
              InputArtifacts:
                - Name: SourceArtifact
              OutputArtifacts:
                - Name: BuildArtifact
        
        # Stage 3: Approval
        - Name: Approval
          Actions:
            - Name: ApprovalAction
              ActionTypeId:
                Category: Approval
                Owner: AWS
                Provider: Manual
                Version: '1'
              TimeoutInMinutes: 5
              Configuration:
                CustomData: "Please review the deployment. If no action is taken within 5 minutes, it will auto-reject."
        
        # Stage 4: Deploy
        - Name: Deploy
          Actions:
            - Name: DeployAction
              ActionTypeId:
                Category: Invoke
                Owner: AWS
                Provider: StepFunctions
                Version: '1'
              Configuration:
                StateMachineArn: !Sub arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:stateMachine:${ProjectName}-start-deployment
              InputArtifacts:
                - Name: BuildArtifact
              OutputArtifacts:
              - Name: DeployArtifact

  # event bridge
  GitRepoChangedExecutionRole2:
    DependsOn: CodePipelineApplication
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ProjectName}-build-docker-image-trigger-role2
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sts:AssumeRole
      MaxSessionDuration: 3600
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AWSCodePipeline_FullAccess
  GitRepoChangedRule02:
    DependsOn: GitRepoChangedExecutionRole2
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub ${ProjectName}-build-docker-image-trigger-event-2
      EventPattern: !Sub >-
        {
          "source": ["aws.codecommit"],
          "detail-type": ["CodeCommit Repository State Change"],
          "resources": ["arn:aws:codecommit:${AWS::Region}:${AWS::AccountId}:${ProjectName}"],
          "detail": {
            "event": [ "referenceCreated", "referenceUpdated" ],
            "referenceType": ["branch"],
            "referenceName": ["prod"]
          }
        }
      State: ENABLED
      EventBusName: default
      Targets:
        - Id: !Sub ${ProjectName}-build-docker-image-steps-target-id2
          Arn:
            Fn::Sub: arn:${AWS::Partition}:codepipeline:${AWS::Region}:${AWS::AccountId}:${ProjectName}-build-deployment
          RoleArn:
            Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ProjectName}-build-docker-image-trigger-role2
          InputTransformer:
            InputTemplate: |-
              {
                "environmentVariablesOverride": [
                  {
                    "name": "COMMIT_ID",
                    "type": "PLAINTEXT",
                    "value": <commitId>
                  },     {
                    "name": "REPOSITORY_NAME",
                    "type": "PLAINTEXT",
                    "value": <repositoryName>
                  }
                ]
              }
            InputPathsMap:
              commitId: $.detail.commitId
              repositoryName: $.detail.repositoryName

Outputs:
  LoginUrl:
    Value: !Sub https://${AWS::AccountId}.signin.aws.amazon.com/console
  Region:
    Value: !Sub ${AWS::Region}
  Username:
    Value: !Ref MyIAMUser